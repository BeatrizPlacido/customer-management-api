version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bolt_clientes
      POSTGRES_USER: bolt
      POSTGRES_PASSWORD: bolt123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolt -d bolt_clientes"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /app
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bolt_clientes
      SPRING_DATASOURCE_USERNAME: bolt
      SPRING_DATASOURCE_PASSWORD: bolt123

volumes:
  postgres_data:
  maven_cache:
